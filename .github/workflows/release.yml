name: Release

# Build signed-capable macOS + Windows installers. Triggers on a version tag
# (e.g. `git tag v0.9.0 && git push origin v0.9.0`) or manually from the Actions
# tab. Produces a DRAFT GitHub release with both platforms' installers attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only, which makes the release-creation step
# fail with "Resource not accessible by integration". Creating the draft release
# and uploading installers needs contents: write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # universal (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest    # .msi + NSIS .exe
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Signing is enabled by a separate job/step once certs exist — see
      # docs/BUILD.md. This default build is unsigned (ad-hoc), so do NOT pass any
      # APPLE_* env vars: an empty APPLE_CERTIFICATE makes the bundler attempt a
      # keychain import and fail. To sign later, add the Apple secrets and the
      # matching env block back here.
      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "AI Tumor Board __VERSION__"
          releaseBody: "Automated build. See docs/RELEASE_CHECKLIST.md before distributing."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
