[package]
name = "ai-tumor-board"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Enables the offline credential-issuing helper (used by the PI's signing tool
# and tests); not compiled into the shipped app.
issuer-tools = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_tumor_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
crypto_box = "0.9.1"
ed25519-dalek = "3.0.0"
zeroize = "1.9.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
rand = "0.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonschema = "0.47.0"

